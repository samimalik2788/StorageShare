name: Build StorageShare APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install deps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y python3-pip python3-dev python3-venv libssl-dev libffi-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev build-essential git autoconf libtool pkg-config libpango1.0-dev libjpeg-dev libtiff5-dev libatlas-base-dev wget unzip zip curl ccache openjdk-17-jdk
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
        
    - name: Setup
      run: |
        pip install --upgrade pip
        pip install cython==0.29.37 buildozer
        
    - name: Build
      run: buildozer android debug 2>&1
    
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: StorageShare-APK
        path: bin/*.apk
